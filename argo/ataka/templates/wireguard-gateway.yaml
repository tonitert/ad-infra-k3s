{{- $wireguard := .Values.wireguard | default dict -}}
{{- $gateway := get $wireguard "gateway" | default dict -}}
{{- $agent := get $wireguard "routeAgent" | default dict -}}
{{- $routeCidrs := get $wireguard "routeCidrs" | default (list "10.99.0.2/32") -}}
{{- if and (get $wireguard "enabled" | default false) (get $gateway "enabled" | default false) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ataka-wireguard-gateway
  labels:
    app.kubernetes.io/name: ataka-wireguard-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ataka-wireguard-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ataka-wireguard-gateway
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - image: {{ get $gateway "image" | default (get $wireguard "image" | default "ghcr.io/tonitert/ad-infra-k3s/ataka-wireguard:latest") }}
          name: wireguard
          env:
            - name: WIREGUARD_GATEWAY
              value: "true"
            - name: WIREGUARD_ROUTE_CIDRS
              value: {{ join " " $routeCidrs | quote }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - mountPath: /etc/wireguard/wg0.conf
              name: ataka-wireguard-config
              readOnly: true
              subPath: {{ get $wireguard "configKey" | default "wg0.conf" }}
            - mountPath: /dev/net/tun
              name: dev-net-tun
          readinessProbe:
            exec:
              command:
                - wg
                - show
                - wg0
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: ataka-wireguard-config
          secret:
            secretName: {{ get $wireguard "secretName" | default "ataka-wireguard-config" }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
{{- end }}
{{- if and (get $wireguard "enabled" | default false) (get $agent "enabled" | default false) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ataka-route-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ataka-route-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ataka-route-agent
subjects:
  - kind: ServiceAccount
    name: ataka-route-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ataka-route-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ataka-route-agent
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ataka-route-agent
subjects:
  - kind: ServiceAccount
    name: ataka-route-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ataka-route-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ataka-route-agent
  labels:
    app.kubernetes.io/name: ataka-route-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ataka-route-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ataka-route-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: ataka-route-agent
      containers:
        - name: route-agent
          image: {{ get $agent "image" | default "ghcr.io/tonitert/ad-infra-k3s/ataka-route-agent:latest" }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ROUTE_CIDRS
              value: {{ join " " $routeCidrs | quote }}
            - name: ROUTE_TABLE
              value: {{ get $wireguard "routeTable" | default "51820" | quote }}
            - name: ROUTE_MARK
              value: {{ get $wireguard "routeMark" | default "0x51" | quote }}
            - name: ROUTE_PREF_BASE
              value: {{ get $wireguard "routePrefBase" | default "12000" | quote }}
            - name: VPN_LABEL_SELECTOR
              value: {{ printf "%s=%s" (get $wireguard "vpnRouteLabelKey" | default "ataka.ad.tertsonen.xyz/vpn-route") (get $wireguard "vpnRouteLabelValue" | default "true") | quote }}
            - name: ENABLE_DIND_MARKING
              value: {{ ternary "true" "false" (eq (.Values.executor.backend | default "kubernetes") "dind") | quote }}
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
{{- end }}
