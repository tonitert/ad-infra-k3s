{{- $registry := .Values.registry | default dict -}}
{{- if (get $registry "enabled" | default false) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ataka-registry
  labels:
    app.kubernetes.io/name: ataka-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ataka-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ataka-registry
    spec:
      containers:
        - name: registry
          image: {{ get $registry "image" | default "registry:2" }}
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: ataka-registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: ataka-registry
  labels:
    app.kubernetes.io/name: ataka-registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ataka-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
      nodePort: {{ get $registry "nodePort" | default 30500 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: ataka-registry
  name: ataka-registry-data
spec:
  storageClassName: {{ get $registry "storageClassName" | default "longhorn" }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ get $registry "storage" | default "10Gi" }}
{{- end }}
