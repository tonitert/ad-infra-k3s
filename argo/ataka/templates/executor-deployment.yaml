{{- $executor := .Values.executor | default dict -}}
{{- $backend := get $executor "backend" | default "kubernetes" -}}
{{- $buildkit := get $executor "buildkit" | default dict -}}
{{- $wireguard := .Values.wireguard | default dict -}}
{{- $registry := .Values.registry | default dict -}}
{{- $autoscaledNodes := .Values.autoscaledNodes | default dict -}}
{{- $autoscaledToleration := get $autoscaledNodes "toleration" | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ../../apps/ataka/docker-compose.yml -c --generate-network-policies
    kompose.hpa.cpu: 40%
    kompose.hpa.replicas.max: "3"
    kompose.hpa.replicas.min: "1"
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: executor
  name: executor
spec:
  replicas: {{ get $executor "replicas" | default 1 }}
  selector:
    matchLabels:
      io.kompose.service: executor
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ../../apps/ataka/docker-compose.yml -c --generate-network-policies
        kompose.hpa.cpu: 40%
        kompose.hpa.replicas.max: "3"
        kompose.hpa.replicas.min: "1"
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.network/ataka-ataka: "true"
        io.kompose.service: executor
{{- if and (eq $backend "dind") (get $wireguard "enabled" | default false) }}
        {{ get $wireguard "vpnRouteLabelKey" | default "ataka.ad.tertsonen.xyz/vpn-route" }}: {{ get $wireguard "vpnRouteLabelValue" | default "true" | quote }}
{{- end }}
    spec:
      serviceAccountName: {{ get $executor "serviceAccountName" | default "ataka-executor" }}
{{- if eq $backend "dind" }}
      initContainers:
        - image: docker:28.4.0-dind
          name: dind
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          restartPolicy: Always
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsUser: 0
          ports:
            - containerPort: 2375
              protocol: TCP
          volumeMounts:
            - mountPath: /data/shared
              name: shared
            - mountPath: /data/exploits
              name: exploits
            - mountPath: /data/persist
              name: persists
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
{{- end }}
      containers:
        - envFrom:
            - secretRef:
                name: ataka-env-secret
          env:
            - name: EXECUTOR_BACKEND
              value: {{ $backend | quote }}
{{- if eq $backend "dind" }}
            - name: DOCKER_HOST
              value: tcp://localhost:2375
{{- else }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EXECUTOR_SERVICE_ACCOUNT
              value: {{ get $executor "serviceAccountName" | default "ataka-executor" | quote }}
            - name: BUILDKIT_BUILDER_NAME
              value: {{ get $buildkit "builderName" | default "ataka-buildkit" | quote }}
            - name: BUILDKIT_IMAGE
              value: {{ get $buildkit "image" | default "moby/buildkit:buildx-stable-1" | quote }}
            - name: BUILDKIT_REPLICAS
              value: {{ get $buildkit "replicas" | default 1 | quote }}
            - name: BUILDKIT_STORAGE
              value: {{ if hasKey $buildkit "storage" }}{{ get $buildkit "storage" | quote }}{{ else }}{{ "20Gi" | quote }}{{ end }}
            - name: BUILDKIT_DRIVER_OPTIONS
              value: {{ get $buildkit "driverOptions" | default "" | quote }}
            - name: EXPLOIT_REGISTRY_PULL
              value: {{ get $registry "host" | default "ataka-registry.local" | quote }}
            - name: EXPLOIT_REGISTRY_PUSH
              value: {{ get $registry "pushHost" | default "ataka-registry:5000" | quote }}
            - name: VPN_ROUTE_LABEL_KEY
              value: {{ get $wireguard "vpnRouteLabelKey" | default "ataka.ad.tertsonen.xyz/vpn-route" | quote }}
            - name: VPN_ROUTE_LABEL_VALUE
              value: {{ get $wireguard "vpnRouteLabelValue" | default "true" | quote }}
            - name: AUTOSCALED_TOLERATION_KEY
              value: {{ get $autoscaledToleration "key" | default "" | quote }}
            - name: AUTOSCALED_TOLERATION_VALUE
              value: {{ get $autoscaledToleration "value" | default "" | quote }}
            - name: AUTOSCALED_TOLERATION_EFFECT
              value: {{ get $autoscaledToleration "effect" | default "NoSchedule" | quote }}
{{- end }}
          image: {{ get $executor "image" | default "ghcr.io/tonitert/ad-infra-k3s/ataka-executor:latest" }}
          imagePullPolicy: Always
          name: executor
          command:
            - sh
            - -c
            - |
              mkdir -p /data/shared/exploits /data/persist
{{- if eq $backend "dind" }}
              until docker version >/dev/null 2>&1; do sleep 1; done
{{- end }}
              exec sh /ataka/common/delayed_start.sh -- python -m ataka.executor
          securityContext:
            runAsGroup: 966
            runAsUser: 1000
          volumeMounts:
            - mountPath: /data/shared
              name: shared
            - mountPath: /data/exploits
              name: exploits
            - mountPath: /data/persist
              name: persists
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      hostname: ataka-executor
      restartPolicy: Always
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: shared
        - name: exploits
          persistentVolumeClaim:
            claimName: exploits
        - name: persists
          persistentVolumeClaim:
            claimName: persists
