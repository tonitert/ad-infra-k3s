{{- $executor := .Values.executor | default dict -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: executor
spec:
  maxReplicas: {{ get $executor "maxReplicas" | default 4 }}
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 90
          type: Utilization
      type: Resource
    - resource:
        name: memory
        target:
          averageUtilization: 90
          type: Utilization
      type: Resource
  minReplicas: {{ get $executor "replicas" | default 1 }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: executor
