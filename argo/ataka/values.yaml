ingress:
  enabled: true
  host: ataka.ad.tertsonen.xyz
  basicAuth:
    enabled: true

executor:
  replicas: 1
  backend: kubernetes
  image: ghcr.io/tonitert/ad-infra-k3s/ataka-executor:latest
  serviceAccountName: ataka-executor
  buildkit:
    builderName: ataka-buildkit
    image: moby/buildkit:buildx-stable-1
    replicas: 1
    storage: ""
    driverOptions: ""
  podAdmissionPolicy:
    enabled: true

autoscaledNodes:
  toleration:
    key: ataka.ad.tertsonen.xyz/autoscaled
    value: "true"
    effect: NoSchedule

openvpn:
  enabled: false
  image: ghcr.io/tonitert/ad-infra-k3s/ataka-openvpn:latest
  secretName: openvpn-config
  configKey: vpn.conf
  device: tun0
  routeCidrs: []
  gateway:
    enabled: false
    image: ghcr.io/tonitert/ad-infra-k3s/ataka-openvpn:latest
  routeAgent:
    enabled: true
    image: ghcr.io/tonitert/ad-infra-k3s/ataka-route-agent:latest
  routeTable: "201"
  routeMark: "0x52"
  vpnRouteLabelKey: ataka.ad.tertsonen.xyz/vpn-route
  vpnRouteLabelValue: "true"

wireguard:
  enabled: true
  image: ghcr.io/tonitert/ad-infra-k3s/ataka-wireguard:latest
  secretName: ataka-wireguard-config
  configKey: wg0.conf
  routeCidrs:
    - 10.99.0.2/32
  gateway:
    enabled: true
    image: ghcr.io/tonitert/ad-infra-k3s/ataka-wireguard:latest
  routeAgent:
    enabled: true
    image: ghcr.io/tonitert/ad-infra-k3s/ataka-route-agent:latest
  routeTable: "200"
  routeMark: "0x51"
  routePrefBase: "12000"
  vpnRouteLabelKey: ataka.ad.tertsonen.xyz/vpn-route
  vpnRouteLabelValue: "true"

registry:
  enabled: true
  image: registry:2
  host: ataka-registry.local
  pushHost: ataka-registry:5000
  nodePort: 30500
  storage: 10Gi
  storageClassName: longhorn
