apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: rsync
  name: rsync
  namespace: tulip
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: rsync
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: rsync
    spec:
      containers:
        - env:
            - name: RSYNC_SOURCE
              value: {{ required "enowars.pcapRsyncSource is required" .Values.enowars.pcapRsyncSource | quote }}
            # Cron task for periodic rsync - this is how eeacms/rsync actually works
            - name: CRON_TASK_1
              value: "*/2 * * * * flock -n /var/lock/rsync.lock -c \"rsync -e 'ssh -o StrictHostKeyChecking=accept-new' -avz --stats --delete \\\"$RSYNC_SOURCE\\\" /traffic/\""
          image: eeacms/rsync:latest
          name: rsync
          # Run in client mode to execute cron tasks
          args: ["client"]
          volumeMounts:
            - mountPath: /traffic
              name: traffic
              readOnly: false
            - mountPath: /root/.ssh
              name: rsync-keys
          # Add resource limits to prevent excessive resource usage
          resources:
            limits:
              cpu: "700m"
              memory: "1024Mi"
            requests:
              cpu: "10m"
              memory: "50Mi"
      restartPolicy: Always
      volumes:
        - name: traffic
          persistentVolumeClaim:
            claimName: traffic
            readOnly: false
        - name: rsync-keys
          persistentVolumeClaim:
            claimName: rsync-keys
            readOnly: false
