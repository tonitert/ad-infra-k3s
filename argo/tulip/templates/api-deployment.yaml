apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
    org.opencontainers.image.source: https://github.com/tonitert/ad-infra-k3s
  labels:
    io.kompose.service: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
        org.opencontainers.image.source: https://github.com/tonitert/ad-infra-k3s
        checksum/tulip-config: {{ include (print $.Template.BasePath "/tulip-configmap.yaml") . | sha256sum }}
      labels:
        io.kompose.service: api
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: tulip-config
          env:
            - name: TULIP_TRAFFIC_DIR
              value: /traffic
          image: ghcr.io/tonitert/ad-infra-k3s/tulip-api:latest
          name: api
          volumeMounts:
            - mountPath: /traffic
              name: traffic
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: traffic
          persistentVolumeClaim:
            claimName: traffic
            readOnly: true
