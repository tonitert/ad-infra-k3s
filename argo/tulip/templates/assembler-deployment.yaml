apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
    org.opencontainers.image.source: https://github.com/tonitert/ad-infra-k3s
  labels:
    io.kompose.service: assembler
  name: assembler
  namespace: tulip
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: assembler
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
        org.opencontainers.image.source: https://github.com/tonitert/ad-infra-k3s
      labels:
        io.kompose.service: assembler
    spec:
      containers:
        - args:
            - ./assembler
            - -http-session-tracking
            - -skipchecksum
            - -disable-converters
            - -dir
            - /traffic
          envFrom:
            - configMapRef:
                name: tulip-config
          image: ghcr.io/tonitert/ad-infra-k3s/tulip-assembler:latest
          name: assembler
          ports:
            - containerPort: 8080
              name: health
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  last="$(wget -qO- http://127.0.0.1:8080/healthz)"
                  case "$last" in ''|*[!0-9]*) exit 1;; esac
                  now="$(date +%s)"
                  test $((now - last)) -le 240
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - mountPath: /traffic
              name: traffic
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"
      restartPolicy: Always
      volumes:
        - name: traffic
          persistentVolumeClaim:
            claimName: traffic
            readOnly: true
